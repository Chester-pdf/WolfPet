          package com.wolfplus;

          import com.wolfplus.mixin.LivingEntityAccessor;
          import net.minecraft.tags.FluidTags;
          import net.minecraft.world.entity.EquipmentSlot;
          import net.minecraft.world.entity.Mob;
          import net.minecraft.world.entity.ai.attributes.Attributes;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.item.Items;
          import net.minecraft.world.phys.Vec3;

          /**
           * Управление питомцем верхом (по образцу свиньи/лошади), общее для волка, кошки и кролика.
           * Миксины WolfRideMixin / CatRideMixin / RabbitRideMixin только вызывают эти методы.
           *
           * Без седла getControllingPassenger() = null: питомец живёт своей жизнью (ИИ), игрок просто едет.
           * С седлом управляет игрок:
           *  - WASD, взгляд задаёт направление, спринт ускоряет;
           *  - прыжок (пробел) и автопрыжок через препятствие в 1 блок;
           *  - в воде питомец держится на поверхности и плывёт вперёд;
           *  - двойное нажатие прыжка при надетых элитрах включает/выключает полёт
           *    (сам режим включает сервер - noGravity; тут только физика и детект нажатий).
           *
           * Физика считается на клиенте всадника (как у лошади), поэтому детект пробела тоже клиентский.
           */
          public final class RideLogic {
              /** Начальная скорость прыжка: 0.42 = обычный прыжок игрока (~1.25 блока). */
              private static final double JUMP_POWER = 0.52;

              /** Окно двойного нажатия, тиков. */
              private static final long DOUBLE_TAP_TICKS = 8L;

              /** Состояние детекта двойного нажатия (по одному на питомца). */
              public static final class State {
                  boolean prevJump;
                  long lastJumpPress;
              }

              private RideLogic() {
              }

              public static boolean isSaddled(Mob mob) {
                  return !mob.getItemBySlot(EquipmentSlot.SADDLE).isEmpty();
              }

              public static boolean hasElytra(Mob mob) {
                  return mob.getItemBySlot(EquipmentSlot.CHEST).is(Items.ELYTRA);
              }

              public static boolean isFlying(Mob mob) {
                  return mob.isNoGravity() && hasElytra(mob);
              }

              public static void tick(Mob mob, Player player, State state) {
                  boolean flying = isFlying(mob);

                  // Нажатия пробела читаем только на клиенте всадника.
                  boolean jump = false;
                  if (mob.level().isClientSide()) {
                      jump = ((LivingEntityAccessor) player).wolfplus$isJumping();
                      if (jump && !state.prevJump) {
                          long now = mob.level().getGameTime();
                          if (now - state.lastJumpPress <= DOUBLE_TAP_TICKS && (flying || hasElytra(mob))) {
                              WolfFlightHooks.CLIENT_TOGGLE.accept(mob.getId());
                              state.lastJumpPress = 0L;
                          } else {
                              state.lastJumpPress = now;
                          }
                      }
                      state.prevJump = jump;
                  }

                  // Питомец смотрит туда же, куда игрок (в полёте - ещё и вверх/вниз).
                  mob.setYRot(player.getYRot() % 360.0F);
                  mob.setXRot((flying ? player.getXRot() : player.getXRot() * 0.5F) % 360.0F);
                  mob.yRotO = mob.yBodyRot = mob.yHeadRot = mob.getYRot();

                  Vec3 motion = mob.getDeltaMovement();

                  if (flying) {
                      // Свободный полёт: куда смотрим, туда и летим.
                      Vec3 look = player.getLookAngle();
                      if (player.zza > 0.0F) {
                          mob.setDeltaMovement(look.scale(player.isSprinting() ? 1.1 : 0.7));
                      } else if (player.zza < 0.0F) {
                          mob.setDeltaMovement(look.scale(-0.25));
                      } else {
                          mob.setDeltaMovement(motion.scale(0.85));
                      }
                      return;
                  }

                  if (mob.isInWater()) {
                      // Держимся на поверхности (пробел - всплыть выше) и плывём вперёд.
                      double y = motion.y;
                      if (mob.getFluidHeight(FluidTags.WATER) > 0.4) {
                          y = Math.min(y + 0.04, 0.12);
                      }
                      if (jump) {
                          y = Math.min(y + 0.04, 0.2);
                      }
                      double yaw = Math.toRadians(mob.getYRot());
                      double sin = Math.sin(yaw);
                      double cos = Math.cos(yaw);
                      double forward = player.zza * (player.isSprinting() ? 0.07 : 0.05);
                      double side = player.xxa * 0.03;
                      mob.setDeltaMovement(
                              motion.x + side * cos - forward * sin,
                              y,
                              motion.z + forward * cos + side * sin);
                      return;
                  }

                  if (mob.onGround()) {
                      if (jump) {
                          mob.setDeltaMovement(motion.x, JUMP_POWER, motion.z);
                      } else if (player.zza > 0.0F && mob.horizontalCollision) {
                          // Автопрыжок через препятствие высотой в блок.
                          mob.setDeltaMovement(motion.x, 0.42, motion.z);
                      }
                  }
              }

              public static Vec3 input(Mob mob, Player player) {
                  if (isFlying(mob)) {
                      return Vec3.ZERO; // скорость в полёте задаём напрямую в tick()
                  }
                  float sideways = player.xxa * 0.5F;
                  float forward = player.zza;
                  if (forward <= 0.0F) {
                      forward *= 0.25F;
                  }
                  return new Vec3(sideways, 0.0, forward);
              }

              public static float speed(Mob mob, Player player) {
                  float speed = (float) mob.getAttributeValue(Attributes.MOVEMENT_SPEED);
                  return player.isSprinting() ? speed * 1.4F : speed;
              }
          }
