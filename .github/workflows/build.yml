          package com.wolfplus.net;

          import com.wolfplus.WolfPlus;
          import net.minecraft.network.RegistryFriendlyByteBuf;
          import net.minecraft.network.codec.ByteBufCodecs;
          import net.minecraft.network.codec.StreamCodec;
          import net.minecraft.network.protocol.common.custom.CustomPacketPayload;

          /**
           * Сервер -> клиент: открыть меню настройки волка.
           *
           * @param firstTime    true, если волка только что приручили
           * @param name         текущее имя ("" если без имени)
           * @param variantIndex индекс породы в {@link com.wolfplus.WolfOptions#VARIANTS}
           * @param colorId      id цвета ошейника (DyeColor#getId)
           */
          public record OpenWolfMenuPayload(int entityId, boolean firstTime, String name, int variantIndex, int colorId)
                  implements CustomPacketPayload {

              public static final CustomPacketPayload.Type<OpenWolfMenuPayload> TYPE =
