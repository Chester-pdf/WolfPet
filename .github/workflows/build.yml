          package com.wolfplus.client.mixin;

          import com.wolfplus.client.render.WolfGearAccess;
          import com.wolfplus.client.render.WolfGearLayer;
          import net.minecraft.client.renderer.entity.EntityRendererProvider;
          import net.minecraft.client.renderer.entity.WolfRenderer;
