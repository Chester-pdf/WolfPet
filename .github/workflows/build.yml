          package com.wolfplus.mixin;

          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.EquipmentSlot;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.TamableAnimal;
          import net.minecraft.world.entity.ai.attributes.Attributes;
          import net.minecraft.world.entity.animal.wolf.Wolf;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.phys.Vec3;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.Unique;

          /**
           * Управление волком верхом (по образцу свиньи/лошади).
           *
           * Без седла getControllingPassenger() = null: волк живёт своей жизнью (ИИ), игрок просто едет.
           * С седлом управляет игрок: WASD, взгляд задаёт направление, спринт ускоряет,
           * перед препятствием в 1 блок волк прыгает сам.
           */
          @Mixin(Wolf.class)
          public abstract class WolfRideMixin extends TamableAnimal {
              protected WolfRideMixin(EntityType<? extends TamableAnimal> type, Level level) {
                  super(type, level);
              }

              @Unique
              private boolean wolfplus$isSaddled() {
                  return !this.getItemBySlot(EquipmentSlot.SADDLE).isEmpty();
              }

              @Override
              public LivingEntity getControllingPassenger() {
                  if (this.getFirstPassenger() instanceof Player player) {
                      return this.wolfplus$isSaddled() ? player : null;
                  }
                  return super.getControllingPassenger();
              }

              @Override
              protected void tickRidden(Player player, Vec3 travelVector) {
                  super.tickRidden(player, travelVector);

                  // Волк смотрит туда же, куда игрок.
                  this.setRot(player.getYRot(), player.getXRot() * 0.5F);
                  this.yRotO = this.yBodyRot = this.yHeadRot = this.getYRot();

                  // Автопрыжок через препятствие высотой в блок.
                  if (player.zza > 0.0F && this.horizontalCollision && this.onGround()) {
                      Vec3 motion = this.getDeltaMovement();
                      this.setDeltaMovement(motion.x, 0.42, motion.z);
                  }
              }

              @Override
              protected Vec3 getRiddenInput(Player player, Vec3 travelVector) {
                  float sideways = player.xxa * 0.5F;
                  float forward = player.zza;
                  if (forward <= 0.0F) {
                      forward *= 0.25F;
                  }
                  return new Vec3(sideways, 0.0, forward);
              }

              @Override
              protected float getRiddenSpeed(Player player) {
                  float speed = (float) this.getAttributeValue(Attributes.MOVEMENT_SPEED);
                  return player.isSprinting() ? speed * 1.4F : speed;
              }
          }
