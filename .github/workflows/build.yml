          package com.wolfplus.client.render;

          import net.minecraft.client.model.EntityModel;
          import net.minecraft.client.model.geom.ModelPart;
          import net.minecraft.client.renderer.entity.state.LivingEntityRenderState;

          /**
           * Крылья элитр для волка: запечённая модель ModelLayers.ELYTRA, но принимающая любое состояние рендера
           * (ванильная ElytraModel привязана к состоянию гуманоида). Позу крыльев задаём вручную.
           */
          public class WingsModel extends EntityModel<LivingEntityRenderState> {
              private static final float FOLDED = 0.2617994F;
              private static final float SPREAD = 1.0F;

              private final ModelPart left;
              private final ModelPart right;

              public WingsModel(ModelPart root) {
                  super(root);
                  this.left = root.getChild("left_wing");
                  this.right = root.getChild("right_wing");
              }

              /** true - крылья раскрыты (полёт), false - сложены. */
              public void setSpread(boolean spread) {
                  float z = spread ? SPREAD : FOLDED;
                  this.left.xRot = FOLDED;
                  this.left.zRot = -z;
                  this.right.xRot = FOLDED;
                  this.right.zRot = z;
              }
          }
