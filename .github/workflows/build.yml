          cat > 'src/main/java/com/wolfplus/mixin/WolfRideMixin.java' <<'WOLFPLUS_EOF'
          package com.wolfplus.mixin;

          import com.wolfplus.WolfFlightHooks;
          import net.minecraft.tags.FluidTags;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.EquipmentSlot;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.TamableAnimal;
          import net.minecraft.world.entity.ai.attributes.Attributes;
          import net.minecraft.world.entity.animal.wolf.Wolf;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.item.Items;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.phys.Vec3;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.Unique;

          /**
           * Управление волком верхом (по образцу свиньи/лошади).
           *
           * Без седла getControllingPassenger() = null: волк живёт своей жизнью (ИИ), игрок просто едет.
           * С седлом управляет игрок:
           *  - WASD, взгляд задаёт направление, спринт ускоряет;
           *  - прыжок (пробел) и автопрыжок через препятствие в 1 блок;
           *  - в воде волк держится на поверхности и плывёт вперёд;
           *  - двойное нажатие прыжка при надетых элитрах включает/выключает полёт
           *    (сам режим включает сервер - noGravity; тут только физика и детект нажатий).
           *
           * Физика считается на клиенте всадника (как у лошади), поэтому детект пробела тоже клиентский.
           */
          @Mixin(Wolf.class)
          public abstract class WolfRideMixin extends TamableAnimal {
              /** Начальная скорость прыжка: 0.42 = обычный прыжок игрока (~1.25 блока). */
              @Unique
              private static final double WOLFPLUS_JUMP_POWER = 0.52;

              /** Окно двойного нажатия, тиков. */
              @Unique
              private static final long WOLFPLUS_DOUBLE_TAP_TICKS = 8L;

              @Unique
              private boolean wolfplus$prevJump;

              @Unique
              private long wolfplus$lastJumpPress;

              protected WolfRideMixin(EntityType<? extends TamableAnimal> type, Level level) {
                  super(type, level);
              }

              @Unique
              private boolean wolfplus$isSaddled() {
                  return !this.getItemBySlot(EquipmentSlot.SADDLE).isEmpty();
              }

              @Unique
              private boolean wolfplus$hasElytra() {
                  return this.getItemBySlot(EquipmentSlot.CHEST).is(Items.ELYTRA);
              }

              @Unique
              private boolean wolfplus$isFlying() {
                  return this.isNoGravity() && this.wolfplus$hasElytra();
              }

              @Override
              public LivingEntity getControllingPassenger() {
                  if (this.getFirstPassenger() instanceof Player player) {
                      return this.wolfplus$isSaddled() ? player : null;
                  }
                  return super.getControllingPassenger();
              }

              @Override
              protected void tickRidden(Player player, Vec3 travelVector) {
                  super.tickRidden(player, travelVector);

                  boolean flying = this.wolfplus$isFlying();

                  // Нажатия пробела читаем только на клиенте всадника.
                  boolean jump = false;
                  if (this.level().isClientSide()) {
                      jump = ((LivingEntityAccessor) player).wolfplus$isJumping();
                      if (jump && !this.wolfplus$prevJump) {
                          long now = this.level().getGameTime();
                          if (now - this.wolfplus$lastJumpPress <= WOLFPLUS_DOUBLE_TAP_TICKS
                                  && (flying || this.wolfplus$hasElytra())) {
                              WolfFlightHooks.CLIENT_TOGGLE.accept(this.getId());
                              this.wolfplus$lastJumpPress = 0L;
                          } else {
                              this.wolfplus$lastJumpPress = now;
                          }
                      }
                      this.wolfplus$prevJump = jump;
                  }

                  // Волк смотрит туда же, куда игрок (в полёте - ещё и вверх/вниз).
                  this.setRot(player.getYRot(), flying ? player.getXRot() : player.getXRot() * 0.5F);
                  this.yRotO = this.yBodyRot = this.yHeadRot = this.getYRot();

                  Vec3 motion = this.getDeltaMovement();

                  if (flying) {
                      // Свободный полёт: куда смотрим, туда и летим.
                      Vec3 look = player.getLookAngle();
                      if (player.zza > 0.0F) {
                          this.setDeltaMovement(look.scale(player.isSprinting() ? 1.1 : 0.7));
                      } else if (player.zza < 0.0F) {
                          this.setDeltaMovement(look.scale(-0.25));
                      } else {
                          this.setDeltaMovement(motion.scale(0.85));
                      }
                      return;
                  }

                  if (this.isInWater()) {
                      // Держимся на поверхности (пробел - всплыть выше) и плывём вперёд.
                      double y = motion.y;
                      if (this.getFluidHeight(FluidTags.WATER) > 0.4) {
                          y = Math.min(y + 0.04, 0.12);
                      }
                      if (jump) {
                          y = Math.min(y + 0.04, 0.2);
                      }
                      double yaw = Math.toRadians(this.getYRot());
                      double sin = Math.sin(yaw);
                      double cos = Math.cos(yaw);
                      double forward = player.zza * (player.isSprinting() ? 0.07 : 0.05);
                      double side = player.xxa * 0.03;
                      this.setDeltaMovement(
                              motion.x + side * cos - forward * sin,
                              y,
                              motion.z + forward * cos + side * sin);
                      return;
                  }

                  if (this.onGround()) {
                      if (jump) {
                          this.setDeltaMovement(motion.x, WOLFPLUS_JUMP_POWER, motion.z);
                      } else if (player.zza > 0.0F && this.horizontalCollision) {
                          // Автопрыжок через препятствие высотой в блок.
                          this.setDeltaMovement(motion.x, 0.42, motion.z);
                      }
                  }
              }

              @Override
              protected Vec3 getRiddenInput(Player player, Vec3 travelVector) {
                  if (this.wolfplus$isFlying()) {
                      return Vec3.ZERO; // скорость в полёте задаём напрямую в tickRidden
                  }
                  float sideways = player.xxa * 0.5F;
                  float forward = player.zza;
                  if (forward <= 0.0F) {
                      forward *= 0.25F;
                  }
                  return new Vec3(sideways, 0.0, forward);
              }

              @Override
              protected float getRiddenSpeed(Player player) {
                  float speed = (float) this.getAttributeValue(Attributes.MOVEMENT_SPEED);
                  return player.isSprinting() ? speed * 1.4F : speed;
              }
          }
