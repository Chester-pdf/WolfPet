          package com.wolfplus.net;

          import com.wolfplus.WolfPlus;
          import net.minecraft.network.RegistryFriendlyByteBuf;
          import net.minecraft.network.codec.ByteBufCodecs;
          import net.minecraft.network.codec.StreamCodec;
          import net.minecraft.network.protocol.common.custom.CustomPacketPayload;

          /** Клиент -> сервер: игрок хочет сесть на своего волка (Shift + удар). */
          public record MountWolfPayload(int entityId) implements CustomPacketPayload {

              public static final CustomPacketPayload.Type<MountWolfPayload> TYPE =
                      new CustomPacketPayload.Type<>(WolfPlus.id("mount_wolf"));

              public static final StreamCodec<RegistryFriendlyByteBuf, MountWolfPayload> CODEC = StreamCodec.composite(
                      ByteBufCodecs.VAR_INT, MountWolfPayload::entityId,
                      MountWolfPayload::new);

              @Override
              public CustomPacketPayload.Type<? extends CustomPacketPayload> type() {
                  return TYPE;
              }
          }
