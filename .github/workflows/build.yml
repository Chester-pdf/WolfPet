                  // Питомец, сохранённый в полёте (noGravity), после загрузки не должен висеть в воздухе.
                  ServerEntityEvents.ENTITY_LOAD.register((entity, world) -> {
                      if (entity instanceof Mob mob && mob.isNoGravity() && PetKind.of(mob) != null
                              && !FLIGHTS.containsKey(mob.getUUID())) {
                          mob.setNoGravity(false);
                      }
                  });

                  ServerPlayNetworking.registerGlobalReceiver(WolfSettingsPayload.TYPE, (payload, context) -> {
                      Mob pet = findOwnedPet(context.player(), payload.entityId());
                      if (pet != null) {
                          applySettings(pet, payload);
                      }
                  });

                  ServerPlayNetworking.registerGlobalReceiver(UntameWolfPayload.TYPE, (payload, context) -> {
                      Mob pet = findOwnedPet(context.player(), payload.entityId());
                      if (pet != null) {
                          untame(pet, context.player());
                      }
                  });

                  ServerPlayNetworking.registerGlobalReceiver(MountWolfPayload.TYPE, (payload, context) -> {
                      ServerPlayer player = context.player();
                      Mob pet = findOwnedPet(player, payload.entityId());
                      if (pet != null && !player.isPassenger() && !player.isSpectator()) {
                          PENDING_MOUNTS.put(player.getUUID(), new PendingMount(pet.getId()));
                      }
                  });

                  ServerPlayNetworking.registerGlobalReceiver(WolfFlightPayload.TYPE, (payload, context) ->
                          toggleFlight(context.player(), payload.entityId()));
              }

              // ---------------------------------------------------------------- взаимодействие

              private static InteractionResult onUse(Player player, Level level, InteractionHand hand, Entity entity,
                      EntityHitResult hitResult) {
                  PetKind kind = PetKind.of(entity);
                  if (kind == null || player.isSpectator()) {
                      return InteractionResult.PASS;
                  }
                  Mob pet = (Mob) entity;

                  boolean client = level.isClientSide();
                  InteractionResult handled = client ? InteractionResult.SUCCESS : InteractionResult.SUCCESS_SERVER;
                  ItemStack stack = player.getItemInHand(hand);

                  if (PetKind.isTamed(pet)) {
                      boolean mine = PetKind.isOwnedBy(pet, player);
                      if (mine) {
                          // Надеть седло / элитры (взрослому питомцу)
                          if (!pet.isBaby()) {
                              EquipmentSlot slot = null;
                              if (stack.is(Items.SADDLE)) {
                                  slot = EquipmentSlot.SADDLE;
                              } else if (stack.is(Items.ELYTRA)) {
                                  slot = EquipmentSlot.CHEST;
                              }
                              if (slot != null && !hasGear(pet, slot)) {
                                  if (!client) {
                                      pet.setItemSlot(slot, stack.copyWithCount(1));
                                      stack.consume(1, player);
                                  }
                                  return handled;
                              }
                          }
                          // Снять: ножницы -> седло, Shift + ножницы -> элитры
                          if (stack.is(Items.SHEARS)) {
                              EquipmentSlot slot = player.isShiftKeyDown() ? EquipmentSlot.CHEST : EquipmentSlot.SADDLE;
                              if (hasGear(pet, slot)) {
                                  if (!client) {
                                      ItemStack gear = pet.getItemBySlot(slot).copy();
                                      pet.setItemSlot(slot, ItemStack.EMPTY);
                                      giveOrDrop(player, gear);
                                      stack.hurtAndBreak(1, player,
                                              hand == InteractionHand.MAIN_HAND ? EquipmentSlot.MAINHAND : EquipmentSlot.OFFHAND);
                                  }
                                  return handled;
                              }
                          }
                      }

                      // Shift + ПКМ пустой рукой по своему питомцу -> меню настройки / расприручения
                      if (hand == InteractionHand.MAIN_HAND && stack.isEmpty() && player.isShiftKeyDown() && mine) {
                          if (!client && player instanceof ServerPlayer serverPlayer) {
                              openMenu(serverPlayer, pet, false);
                          }
                          return handled;
                      }
                      return InteractionResult.PASS; // всё остальное - как в ванилле
                  }

                  // Дикий кролик приручается другим модом (морковью) - не мешаем
                  if (kind == PetKind.RABBIT) {
                      return InteractionResult.PASS;
                  }

                  // Дикий волк или кошка: "сильное" или "слабое" угощение
                  TamableAnimal tamable = (TamableAnimal) pet;
                  boolean strong;
                  boolean food;
                  if (kind == PetKind.WOLF) {
                      strong = stack.is(Items.BONE);
                      food = strong || isMeat(tamable, stack);
                  } else {
                      strong = FISH.contains(stack.getItem());
                      food = strong || COOKED_FISH.contains(stack.getItem())
                              || (!stack.isEmpty() && tamable.isFood(stack));
                  }
                  if (!food) {
                      return InteractionResult.PASS;
                  }
                  if (pet.getTarget() == player) {
                      return InteractionResult.PASS; // питомец злится на этого игрока - так его не приручить
                  }

                  if (!client && player instanceof ServerPlayer serverPlayer) {
                      feed(serverPlayer, pet, stack, strong);
                  }
                  return handled;
              }

              private static boolean isMeat(TamableAnimal wolf, ItemStack stack) {
                  return !stack.isEmpty() && (MEAT.contains(stack.getItem()) || wolf.isFood(stack));
              }

              private static void feed(ServerPlayer player, Mob pet, ItemStack stack, boolean strong) {
                  var random = pet.getRandom();
                  stack.consume(1, player);

                  int gain = strong ? (random.nextBoolean() ? 5 : 10) : 2 + random.nextInt(3);
                  int total = PROGRESS.merge(pet.getUUID(), gain, Integer::sum);
                  Level level = pet.level();

                  if (total >= NEEDED) {
                      PROGRESS.remove(pet.getUUID());
                      TamableAnimal tamable = (TamableAnimal) pet;
                      tamable.tame(player);
                      pet.getNavigation().stop();
                      pet.setTarget(null);
                      tamable.setOrderedToSit(true);
                      level.broadcastEntityEvent(pet, (byte) 7); // сердечки
                      openMenu(player, pet, true);
                  } else {
                      level.broadcastEntityEvent(pet, (byte) 6); // дымок: пока не вышло
                  }
              }

              // ---------------------------------------------------------------- снаряжение

              private static boolean hasGear(Mob pet, EquipmentSlot slot) {
                  return !pet.getItemBySlot(slot).isEmpty();
              }

              private static boolean elytraUsable(Mob pet) {
                  ItemStack elytra = pet.getItemBySlot(EquipmentSlot.CHEST);
                  return elytra.is(Items.ELYTRA) && elytra.getMaxDamage() - elytra.getDamageValue() > 1;
              }

              private static void giveOrDrop(Player player, ItemStack stack) {
                  if (!player.getInventory().add(stack)) {
                      player.drop(stack, false);
                  }
              }

              // ---------------------------------------------------------------- верховая езда

              /**
               * Садим игрока на питомца, как только он отпустит Shift
               * (пока Shift зажат, игрок не удержится - ванилла сразу ссаживает).
               */
              private static void tickPendingMounts(MinecraftServer server) {
                  if (PENDING_MOUNTS.isEmpty()) {
                      return;
                  }
                  Iterator<Map.Entry<UUID, PendingMount>> it = PENDING_MOUNTS.entrySet().iterator();
                  while (it.hasNext()) {
                      Map.Entry<UUID, PendingMount> entry = it.next();
                      PendingMount pending = entry.getValue();
                      ServerPlayer player = server.getPlayerList().getPlayer(entry.getKey());

                      if (player == null || player.isPassenger() || --pending.ticksLeft < 0) {
                          it.remove();
                          continue;
                      }
                      if (player.isShiftKeyDown()) {
                          continue; // ждём, пока отпустит
                      }

                      Mob pet = findOwnedPet(player, pending.petId);
                      if (pet != null && !pet.isVehicle()) {
                          PetKind.unsit(pet);
                          pet.getNavigation().stop();
                          player.startRiding(pet);
                      }
                      it.remove();
                  }
              }

              // ---------------------------------------------------------------- полёт

              /** Двойной прыжок верхом: включить или выключить полёт. */
              private static void toggleFlight(ServerPlayer player, int entityId) {
                  Entity entity = player.level().getEntity(entityId);
                  if (!(entity instanceof Mob pet)
                          || PetKind.of(pet) == null
                          || player.getVehicle() != pet
                          || !PetKind.isOwnedBy(pet, player)
                          || !hasGear(pet, EquipmentSlot.SADDLE)) {
                      return;
                  }
                  if (FLIGHTS.containsKey(pet.getUUID())) {
                      FLIGHTS.remove(pet.getUUID());
                      stopFlight(pet);
                      return;
                  }
                  if (!elytraUsable(pet)) {
                      return;
                  }
                  FLIGHTS.put(pet.getUUID(), new FlightState());
                  pet.setNoGravity(true);
                  pet.resetFallDistance();
              }

              private static void stopFlight(Mob pet) {
                  pet.setNoGravity(false);
                  pet.resetFallDistance();
                  if (!pet.onGround()) {
                      // Мягкая посадка, если выключили полёт в воздухе.
                      pet.addEffect(new MobEffectInstance(MobEffects.SLOW_FALLING, 80, 0, false, false));
                  }
              }

              private static Mob findPet(MinecraftServer server, UUID uuid) {
                  for (ServerLevel level : server.getAllLevels()) {
                      if (level.getEntity(uuid) instanceof Mob mob && PetKind.of(mob) != null) {
                          return mob;
                      }
                  }
                  return null;
              }

              private static void tickFlights(MinecraftServer server) {
                  if (FLIGHTS.isEmpty()) {
                      return;
                  }
                  Iterator<Map.Entry<UUID, FlightState>> it = FLIGHTS.entrySet().iterator();
                  while (it.hasNext()) {
                      Map.Entry<UUID, FlightState> entry = it.next();
                      FlightState state = entry.getValue();
                      Mob pet = findPet(server, entry.getKey());
                      if (pet == null) {
                          it.remove();
                          continue;
                      }

                      state.ticks++;
                      boolean ok = pet.isAlive()
                              && hasGear(pet, EquipmentSlot.SADDLE)
                              && elytraUsable(pet)
                              && pet.getControllingPassenger() instanceof ServerPlayer;
                      if (ok && state.ticks > 10 && pet.onGround()) {
                          ok = false; // приземлились
                      }
                      if (!ok) {
                          it.remove();
                          stopFlight(pet);
                          continue;
                      }

                      pet.resetFallDistance();
                      if (state.ticks % 20 == 0) {
                          // Элитры изнашиваются, как у игрока: 1 прочность в секунду.
                          pet.getItemBySlot(EquipmentSlot.CHEST).hurtAndBreak(1, pet, EquipmentSlot.CHEST);
                      }
                  }
              }

              // ---------------------------------------------------------------- меню

              private static void openMenu(ServerPlayer player, Mob pet, boolean firstTime) {
                  PetKind kind = PetKind.of(pet);
                  if (kind == null) {
                      return;
                  }
                  String name = pet.hasCustomName() ? pet.getCustomName().getString() : "";
                  int variant = kind.hasVariants(pet) ? kind.variantIndexOf(pet) : -1;
                  ServerPlayNetworking.send(player, new OpenWolfMenuPayload(
                          pet.getId(),
                          firstTime,
                          name,
                          variant,
                          kind.collarOf(pet).getId(),
                          kind.ordinal()));
              }

              /** Питомец, который существует, приручён, принадлежит игроку и находится рядом. Иначе null. */
              private static Mob findOwnedPet(ServerPlayer player, int entityId) {
                  Entity entity = player.level().getEntity(entityId);
                  if (entity instanceof Mob pet
                          && PetKind.of(pet) != null
                          && PetKind.isTamed(pet)
                          && PetKind.isOwnedBy(pet, player)
                          && pet.distanceToSqr(player) <= MAX_DISTANCE_SQ) {
                      return pet;
                  }
                  return null;
              }

              private static void applySettings(Mob pet, WolfSettingsPayload payload) {
                  PetKind kind = PetKind.of(pet);
                  if (kind == null) {
                      return;
                  }
                  String name = payload.name().strip();
                  if (name.length() > WolfOptions.MAX_NAME_LENGTH) {
                      name = name.substring(0, WolfOptions.MAX_NAME_LENGTH);
                  }
                  pet.setCustomName(name.isEmpty() ? null : Component.literal(name));

                  kind.applyVariant(pet, payload.variantIndex());

                  DyeColor color = DyeColor.byId(payload.colorId());
                  kind.setCollar(pet, color);
              }

              // ---------------------------------------------------------------- расприручение

              private static void untame(Mob pet, ServerPlayer player) {
                  PetKind kind = PetKind.of(pet);
                  if (kind == null) {
                      return;
                  }
                  // Останавливаем полёт, ссаживаем всадника и возвращаем седло и элитры владельцу.
                  if (FLIGHTS.remove(pet.getUUID()) != null) {
                      pet.setNoGravity(false);
                  }
                  pet.ejectPassengers();
                  for (EquipmentSlot slot : new EquipmentSlot[] {EquipmentSlot.SADDLE, EquipmentSlot.CHEST}) {
                      ItemStack gear = pet.getItemBySlot(slot);
                      if (!gear.isEmpty()) {
                          ItemStack returned = gear.copy();
                          pet.setItemSlot(slot, ItemStack.EMPTY);
                          giveOrDrop(player, returned);
                      }
                  }

                  kind.untame(pet);
                  pet.setCustomName(null);
                  pet.setTarget(null);
                  pet.getNavigation().stop();
                  pet.level().broadcastEntityEvent(pet, (byte) 6);
              }
          }
