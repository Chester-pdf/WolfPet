           *  - седло надевается ПКМ, элитры тоже ПКМ; ножницы снимают седло, Shift + ножницы - элитры;
           *  - без седла питомец идёт сам, с седлом - им управляет игрок (логика в RideLogic);
           *  - двойное нажатие прыжка верхом (седло + элитры) включает/выключает полёт.
           *    Режим полёта = noGravity у питомца; сервер следит за ним в {@link #tickFlights}.
