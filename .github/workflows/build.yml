          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          /**
           * 1) Добавляет волку слой седла/элитр (без зависимости от Fabric rendering API).
           * 2) Копирует снаряжение волка в состояние рендера.
           */
          @Mixin(WolfRenderer.class)
          public abstract class WolfRendererMixin {
              @Inject(method = "<init>", at = @At("TAIL"))
              private void wolfplus$addGearLayer(EntityRendererProvider.Context context, CallbackInfo ci) {
                  try {
                      WolfRenderer self = (WolfRenderer) (Object) this;
                      ((LivingEntityRendererInvoker) (Object) this).wolfplus$addLayer(new WolfGearLayer(self, context));
                  } catch (Throwable ex) {
                      System.err.println("[wolfplus] could not add gear layer: " + ex);
                      ex.printStackTrace();
                  }
              }

              @Inject(method = "extractRenderState(Lnet/minecraft/world/entity/animal/wolf/Wolf;Lnet/minecraft/client/renderer/entity/state/WolfRenderState;F)V",
                      at = @At("TAIL"))
              private void wolfplus$extractGear(Wolf wolf, WolfRenderState state, float partialTick, CallbackInfo ci) {
                  WolfGearAccess gear = (WolfGearAccess) state;
                  gear.wolfplus$setSaddle(wolf.getItemBySlot(EquipmentSlot.SADDLE));
                  gear.wolfplus$setElytra(wolf.getItemBySlot(EquipmentSlot.CHEST));
                  gear.wolfplus$setFlying(wolf.isNoGravity());
              }
          }
