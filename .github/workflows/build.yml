          mkdir -p 'src/client/java/com/wolfplus/client/render'
          cat > 'src/client/java/com/wolfplus/client/render/WolfGearLayer.java' <<'WOLFPLUS_EOF'
          package com.wolfplus.client.render;

          import com.mojang.blaze3d.vertex.PoseStack;
          import com.mojang.math.Axis;
          import com.wolfplus.WolfPlus;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.model.EntityModel;
          import net.minecraft.client.model.Model;
          import net.minecraft.client.model.geom.EntityModelSet;
          import net.minecraft.client.model.geom.ModelLayers;
          import net.minecraft.client.model.geom.ModelPart;
          import net.minecraft.client.renderer.SubmitNodeCollector;
          import net.minecraft.client.renderer.entity.EntityRendererProvider;
          import net.minecraft.client.renderer.entity.RenderLayerParent;
          import net.minecraft.client.renderer.entity.layers.EquipmentLayerRenderer;
          import net.minecraft.client.renderer.entity.layers.RenderLayer;
          import net.minecraft.client.renderer.entity.state.LivingEntityRenderState;
          import net.minecraft.client.resources.model.EquipmentClientInfo;
          import net.minecraft.core.component.DataComponents;
          import net.minecraft.resources.ResourceKey;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.EquipmentSlot;
          import net.minecraft.world.entity.animal.wolf.Wolf;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.Items;
          import net.minecraft.world.item.equipment.EquipmentAsset;
          import net.minecraft.world.item.equipment.EquipmentAssets;

          /**
           * Слой рендера волка: седло и элитры.
           *
           * Седло рисуется "как броня для волка" (LayerType.WOLF_BODY) с собственным ассетом wolfplus:wolf_saddle.
           * Элитры - ванильными текстурами крыльев (LayerType.WINGS) на отдельной модели, уложенной на спину.
           * Снаряжение берём из клиентской копии волка по id из состояния рендера;
           * у превью-волка в меню id фиктивный, поэтому там ничего не рисуется.
           *
           * Любая ошибка при отрисовке один раз пишется в лог, после чего слой отключается (игра не падает).
           */
          public class WolfGearLayer<S extends LivingEntityRenderState, M extends EntityModel<? super S>>
                  extends RenderLayer<S, M> {

              private static final ResourceKey<EquipmentAsset> SADDLE_ASSET =
                      ResourceKey.create(EquipmentAssets.ROOT_ID, WolfPlus.id("wolf_saddle"));

              private final EquipmentLayerRenderer equipmentRenderer;
              private final EntityModel<S> saddleModel;
              private final WingsModel wingsModel;
              private boolean broken;

              @SuppressWarnings("unchecked")
              public WolfGearLayer(RenderLayerParent<S, M> parent, EntityRendererProvider.Context context) {
                  super(parent);
                  this.equipmentRenderer = context.getEquipmentRenderer();
                  EntityModelSet models = context.getModelSet();

                  // Модель седла - такая же, как у волка, но "раздутая" (макет брони волка), чтобы не мерцало.
                  EntityModel<S> saddle = null;
                  try {
                      Object created = parent.getModel().getClass()
                              .getConstructor(ModelPart.class)
                              .newInstance(models.bakeLayer(ModelLayers.WOLF_ARMOR));
                      saddle = (EntityModel<S>) created;
                  } catch (ReflectiveOperationException | RuntimeException ex) {
                      System.err.println("[wolfplus] saddle model unavailable: " + ex);
                  }
                  this.saddleModel = saddle;
                  this.wingsModel = new WingsModel(models.bakeLayer(ModelLayers.ELYTRA));
              }

              @Override
              public void submit(PoseStack poseStack, SubmitNodeCollector collector, int lightCoords, S state,
                      float yRot, float xRot) {
                  if (this.broken) {
                      return;
                  }
                  try {
                      Minecraft mc = Minecraft.getInstance();
                      if (mc.level == null) {
                          return;
                      }
                      Entity entity = mc.level.getEntity(state.id);
                      if (!(entity instanceof Wolf wolf) || wolf.isBaby()) {
                          return;
                      }

                      ItemStack saddle = wolf.getItemBySlot(EquipmentSlot.SADDLE);
                      if (!saddle.isEmpty() && this.saddleModel != null) {
                          this.saddleModel.setupAnim(state);
                          this.equipmentRenderer.renderLayers(EquipmentClientInfo.LayerType.WOLF_BODY, SADDLE_ASSET,
                                  this.saddleModel, state, saddle, poseStack, collector, lightCoords, 0);
                      }

                      ItemStack elytra = wolf.getItemBySlot(EquipmentSlot.CHEST);
                      if (elytra.is(Items.ELYTRA)) {
                          var equippable = elytra.get(DataComponents.EQUIPPABLE);
                          if (equippable != null && equippable.assetId().isPresent()) {
                              this.wingsModel.setSpread(wolf.isNoGravity());
                              poseStack.pushPose();
                              // Крылья - на спину: в плечах у загривка, лёжа вдоль тела к хвосту.
                              poseStack.translate(0.0F, 10.5F / 16.0F, 1.0F / 16.0F);
                              poseStack.mulPose(Axis.XP.rotationDegrees(90.0F));
                              poseStack.scale(0.7F, 0.7F, 0.7F);
                              this.equipmentRenderer.renderLayers(EquipmentClientInfo.LayerType.WINGS,
                                      equippable.assetId().get(), this.wingsModel, state, elytra, poseStack, collector,
                                      lightCoords, 0);
                              poseStack.popPose();
                          }
                      }
                  } catch (Throwable ex) {
                      this.broken = true;
                      System.err.println("[wolfplus] gear layer disabled after error: " + ex);
                  }
              }
          }
          WOLFPLUS_EOF
          mkdir -p 'src/client/java/com/wolfplus/client/render'
          cat > 'src/client/java/com/wolfplus/client/render/WolfRenderInit.java' <<'WOLFPLUS_EOF'
          package com.wolfplus.client.render;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.rendering.v1.LivingEntityRenderLayerRegistrationCallback;
          import net.minecraft.core.registries.BuiltInRegistries;

          /**
           * Подключает слой седла и элитр к рендереру волка.
           * Это отдельная клиентская точка входа: если слой не собрался или сломался, остальной мод не страдает.
           */
          public class WolfRenderInit implements ClientModInitializer {
              @Override
              @SuppressWarnings({"rawtypes", "unchecked"})
              public void onInitializeClient() {
                  LivingEntityRenderLayerRegistrationCallback.EVENT.register((entityType, renderer, helper, context) -> {
                      if (!"minecraft:wolf".equals(BuiltInRegistries.ENTITY_TYPE.getKey(entityType).toString())) {
                          return;
                      }
                      try {
                          helper.register(new WolfGearLayer(renderer, context));
                      } catch (Throwable ex) {
                          System.err.println("[wolfplus] could not add gear layer: " + ex);
                      }
                  });
              }
          }
          WOLFPLUS_EOF
          mkdir -p 'src/main/resources/assets/wolfplus/equipment'
          cat > 'src/main/resources/assets/wolfplus/equipment/wolf_saddle.json' <<'WOLFPLUS_EOF'
          {
            "layers": {
              "wolf_body": [
                {
                  "texture": "wolfplus:wolf_saddle"
                }
              ]
            }
          }
          WOLFPLUS_EOF
          python3 - <<'WOLFPLUS_EOF'
          import os, struct, zlib

          # Текстура седла для волка (раскладка 64x32 как у брони волка): сиденье на спине + подпруга вокруг туловища.
          W, H = 64, 32
          px = [[(0, 0, 0, 0)] * W for _ in range(H)]

          def rect(x0, y0, x1, y1, c):
              for y in range(y0, y1):
                  for x in range(x0, x1):
                      px[y][x] = c

          SEAT = (139, 90, 43, 255)
          EDGE = (92, 58, 26, 255)
          BELT = (60, 36, 16, 255)
          BUCKLE = (205, 205, 205, 255)

          rect(36, 20, 42, 29, SEAT)                 # спина
          for x in range(36, 42):
              px[20][x] = EDGE
              px[28][x] = EDGE
          for y in range(20, 29):
              px[y][36] = EDGE
              px[y][41] = EDGE
          for x0 in (18, 24, 30, 36):                # подпруга по всем четырём граням туловища
              rect(x0, 24, x0 + 6, 26, BELT)
          rect(26, 24, 28, 26, BUCKLE)               # пряжка на брюхе

          raw = b"".join(b"\x00" + bytes(v for p in row for v in p) for row in px)

          def chunk(tag, data):
              body = tag + data
              return struct.pack(">I", len(data)) + body + struct.pack(">I", zlib.crc32(body) & 0xFFFFFFFF)

          png = (b"\x89PNG\r\n\x1a\n"
                 + chunk(b"IHDR", struct.pack(">IIBBBBB", W, H, 8, 6, 0, 0, 0))
                 + chunk(b"IDAT", zlib.compress(raw, 9))
                 + chunk(b"IEND", b""))

          out = "src/main/resources/assets/wolfplus/textures/entity/equipment/wolf_body"
          os.makedirs(out, exist_ok=True)
          with open(out + "/wolf_saddle.png", "wb") as f:
              f.write(png)
          WOLFPLUS_EOF

      - name: Build
        run: |
          # Слой рендера (седло/элитры на модели) завязан на внутренние классы Minecraft 26.2.
          # Если он не соберётся - собираем мод без него, чтобы остальное работало.
          if ! gradle build --stacktrace; then
            echo "::warning::Render layer failed to compile - rebuilding WITHOUT saddle/elytra visuals"
            rm -rf src/client/java/com/wolfplus/client/render
            sed -i '/WolfRenderInit/d' src/main/resources/fabric.mod.json
            gradle build --stacktrace
          fi

      # Выгрузка сигнатур нужных классов Minecraft/Fabric (для отладки рендера): Artifacts -> api-dump
      - name: Dump API signatures
        if: always()
        run: |
          mkdir -p dump
          find ~/.gradle -name '*.jar' -size +1M 2>/dev/null > dump/jars.txt || true
          MC=""
          FAB=""
          while read -r j; do
            L=$(unzip -l "$j" 2>/dev/null || true)
            if [ -z "$MC" ] && echo "$L" | grep -q 'net/minecraft/client/renderer/entity/layers/WolfArmorLayer.class'; then MC="$j"; fi
            if [ -z "$FAB" ] && echo "$L" | grep -q 'LivingEntityRenderLayerRegistrationCallback.class'; then FAB="$j"; fi
          done < dump/jars.txt
          echo "minecraft jar: $MC" > dump/api.txt
          echo "fabric rendering jar: $FAB" >> dump/api.txt
          if [ -n "$MC" ]; then
            CLASSES=$(unzip -l "$MC" | awk '{print $4}' | grep -E '(WolfModel|WolfRenderState|WolfRenderer|ElytraModel|WingsLayer|EquipmentLayerRenderer|SimpleEquipmentLayer|layers/RenderLayer|EntityModelSet|geom/ModelLayers|EquipmentClientInfo|SubmitNodeCollector|LivingEntityRenderState|state/EntityRenderState|client/model/EntityModel|client/model/Model)\.class$' | sed 's/\.class$//; s#/#.#g')
            echo "$CLASSES" >> dump/api.txt
            javap -p -cp "$MC" $CLASSES >> dump/api.txt 2>&1 || true
          fi
          if [ -n "$FAB" ]; then
            javap -p -cp "$FAB" 'net.fabricmc.fabric.api.client.rendering.v1.LivingEntityRenderLayerRegistrationCallback' 'net.fabricmc.fabric.api.client.rendering.v1.LivingEntityRenderLayerRegistrationCallback$RegistrationHelper' >> dump/api.txt 2>&1 || true
          fi

      - name: Upload API dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-dump
          path: dump/api.txt
          if-no-files-found: ignore

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: wolfplus
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      # При пуше тега вида v1.0.0 jar прикрепляется к GitHub Release
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
