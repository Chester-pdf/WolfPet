          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      # При пуше тега вида v1.0.0 jar прикрепляется к GitHub Release
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
