           *
           * Приручение диких волков и кошек работает через "очки приручения" (нужно набрать {@link #NEEDED}):
           *  - кость (волк) / сырая рыба (кошка) даёт 5 или 10 очков -> приручение за 1-2 штуки;
           *  - мясо (волк) / жареная рыба (кошка) даёт 2-4 очка      -> приручение за 3-5 штук;
