          package com.wolfplus;

          import com.wolfplus.mixin.WolfAccess;
          import java.lang.reflect.Method;
          import java.util.List;
          import java.util.Locale;
          import net.minecraft.core.Holder;
          import net.minecraft.core.registries.BuiltInRegistries;
          import net.minecraft.core.registries.Registries;
          import net.minecraft.resources.Identifier;
          import net.minecraft.resources.ResourceKey;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.Mob;
          import net.minecraft.world.entity.OwnableEntity;
          import net.minecraft.world.entity.TamableAnimal;
          import net.minecraft.world.entity.animal.wolf.Wolf;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.item.DyeColor;

          /**
           * Какие питомцы поддерживает мод: волк, кошка и кролик.
           *
           * Волк и кошка - обычные TamableAnimal. Кролик приручается другим модом (Rabbit Taming):
           * он добавляет кролику хозяина (OwnableEntity), сидение и ошейник. Без того мода кролик
           * не считается питомцем, и Wolf Taming+ его не трогает.
           */
          public enum PetKind {
              WOLF("minecraft:wolf", "wolfplus.variant."),
              CAT("minecraft:cat", "wolfplus.variant.cat."),
              RABBIT("minecraft:rabbit", "wolfplus.variant.rabbit.");

              /** Породы кошек (ванильные ключи cat_variant). */
              public static final List<String> CAT_VARIANTS = List.of(
                      "tabby", "black", "red", "siamese", "british_shorthair", "calico",
                      "persian", "ragdoll", "white", "jellie", "all_black");

              /** Окрасы кроликов (без убийцы-кролика). Имена совпадают с константами Rabbit.Variant. */
              public static final List<String> RABBIT_VARIANTS = List.of(
                      "brown", "white", "black", "white_splotched", "gold", "salt");

              /** Id типа сущности в реестре. */
              public final String typeId;
              private final String langPrefix;

              PetKind(String typeId, String langPrefix) {
                  this.typeId = typeId;
                  this.langPrefix = langPrefix;
              }

              // ------------------------------------------------------------ определение вида

              /** Вид питомца или null, если это не поддерживаемое животное. */
              public static PetKind of(Entity e) {
                  if (!(e instanceof Mob)) {
                      return null;
                  }
                  String id = String.valueOf(BuiltInRegistries.ENTITY_TYPE.getKey(e.getType()));
                  for (PetKind k : values()) {
                      if (!k.typeId.equals(id)) {
                          continue;
                      }
                      if (k == WOLF && !(e instanceof Wolf)) {
                          return null;
                      }
                      if (k == CAT && !(e instanceof TamableAnimal)) {
                          return null;
                      }
                      if (k == RABBIT && !(e instanceof OwnableEntity)) {
                          return null; // мода приручения кроликов нет
                      }
                      return k;
                  }
                  return null;
              }

              public static PetKind fromOrdinal(int i) {
                  PetKind[] all = values();
                  return i >= 0 && i < all.length ? all[i] : WOLF;
              }

              /** Приручён ли питомец. */
              public static boolean isTamed(Entity e) {
                  if (e instanceof TamableAnimal t) {
                      return t.isTame();
                  }
                  return e instanceof OwnableEntity o && o.getOwnerReference() != null;
              }

              /** Принадлежит ли питомец этому игроку. */
              public static boolean isOwnedBy(Entity e, Player player) {
                  if (e instanceof TamableAnimal t) {
                      return t.isOwnedBy(player);
                  }
                  if (e instanceof OwnableEntity o) {
                      var ref = o.getOwnerReference();
                      return ref != null && ref.getUUID().equals(player.getUUID());
                  }
                  return false;
              }

              // ------------------------------------------------------------ породы

              /** Есть ли у этого питомца выбор породы. */
              public boolean hasVariants(Entity e) {
                  return switch (this) {
                      case WOLF, CAT -> true;
                      case RABBIT -> rabbitSetter(e) != null;
                  };
              }

              public List<String> variants() {
                  return switch (this) {
                      case WOLF -> WolfOptions.VARIANTS;
                      case CAT -> CAT_VARIANTS;
                      case RABBIT -> RABBIT_VARIANTS;
                  };
              }

              /** Ключ перевода названия породы по индексу. */
              public String variantKey(int index) {
                  List<String> list = variants();
                  return this.langPrefix + list.get(Math.floorMod(index, list.size()));
              }

              public int variantIndexOf(Entity e) {
                  return switch (this) {
                      case WOLF -> WolfOptions.variantIndexOf((Wolf) e);
                      case CAT -> Math.max(0, CAT_VARIANTS.indexOf(catVariantName(e)));
                      case RABBIT -> Math.max(0, RABBIT_VARIANTS.indexOf(rabbitVariantName(e)));
                  };
              }

              public void applyVariant(Entity e, int index) {
                  List<String> list = variants();
                  if (index < 0 || index >= list.size()) {
                      return;
                  }
                  switch (this) {
                      case WOLF -> WolfOptions.applyVariant((Wolf) e, index);
                      case CAT -> {
                          var lookup = e.level().registryAccess().lookupOrThrow(Registries.CAT_VARIANT);
                          lookup.get(ResourceKey.create(Registries.CAT_VARIANT,
                                          Identifier.withDefaultNamespace(list.get(index))))
                                  .ifPresent(holder -> Reflect.call(e, "setVariant", holder));
                      }
                      case RABBIT -> {
                          Method setter = rabbitSetter(e);
                          if (setter == null) {
                              return;
                          }
                          for (Object constant : setter.getParameterTypes()[0].getEnumConstants()) {
                              if (((Enum<?>) constant).name().equalsIgnoreCase(list.get(index))) {
                                  try {
                                      setter.invoke(e, constant);
                                  } catch (ReflectiveOperationException | RuntimeException ignored) {
                                      // порода не применилась - ничего страшного
                                  }
                                  return;
                              }
                          }
                      }
                  }
              }

              private static String catVariantName(Entity e) {
                  Object variant = Reflect.call(e, "getVariant");
                  if (variant instanceof Holder<?> holder) {
                      return holder.unwrapKey().map(key -> key.identifier().getPath()).orElse("");
                  }
                  return "";
              }

              private static String rabbitVariantName(Entity e) {
                  Object variant = Reflect.call(e, "getVariant");
                  return variant instanceof Enum<?> en ? en.name().toLowerCase(Locale.ROOT) : "";
              }

              /** setVariant(<enum>) у кролика или null, если у этой версии породы устроены иначе. */
              private static Method rabbitSetter(Entity e) {
                  Method m = Reflect.find(e.getClass(), "setVariant", 1);
                  return m != null && m.getParameterTypes()[0].isEnum() ? m : null;
              }

              // ------------------------------------------------------------ ошейник

              public DyeColor collarOf(Entity e) {
                  switch (this) {
                      case WOLF:
                          return ((Wolf) e).getCollarColor();
                      case CAT: {
                          Object c = Reflect.call(e, "getCollarColor");
                          return c instanceof DyeColor d ? d : DyeColor.RED;
                      }
                      default: {
                          Object c = Reflect.call(e, "rt$getCollar");
                          int id = c instanceof Integer i ? i : -1;
                          return id >= 0 ? DyeColor.byId(id) : DyeColor.RED;
                      }
                  }
              }

              public void setCollar(Entity e, DyeColor color) {
                  switch (this) {
                      case WOLF -> ((WolfAccess) e).wolfplus$setCollarColor(color);
                      case CAT -> Reflect.call(e, "setCollarColor", color);
                      case RABBIT -> Reflect.call(e, "rt$setCollar", color.getId());
                  }
              }

              // ------------------------------------------------------------ сидение и расприручение

              /** Заставляет питомца встать (волки/кошки - стандартно, кролик - через мод приручения). */
              public static void unsit(Entity e) {
                  if (e instanceof TamableAnimal t) {
                      t.setOrderedToSit(false);
                      t.setInSittingPose(false);
                      return;
                  }
                  Reflect.call(e, "rt$setSitting", false);
              }

              /** Снимает приручение (имя и снаряжение обрабатывает вызывающий код). */
              public void untame(Entity e) {
                  if (e instanceof TamableAnimal t) {
                      t.setOrderedToSit(false);
                      t.setInSittingPose(false);
                      t.setOwnerReference(null);
                      t.setTame(false, true);
                  } else {
                      Reflect.call(e, "rt$setSitting", false);
                      Reflect.call(e, "rt$setOwnerUuid", (Object) null);
                      Reflect.call(e, "rt$setCollar", -1);
                  }
              }
          }
