          package com.wolfplus.client.render;

          import com.mojang.blaze3d.vertex.PoseStack;
          import com.mojang.math.Axis;
          import com.wolfplus.WolfPlus;
          import net.minecraft.client.model.animal.wolf.AdultWolfModel;
          import net.minecraft.client.model.animal.wolf.WolfModel;
          import net.minecraft.client.model.geom.EntityModelSet;
          import net.minecraft.client.model.geom.ModelLayers;
          import net.minecraft.client.renderer.SubmitNodeCollector;
          import net.minecraft.client.renderer.entity.EntityRendererProvider;
          import net.minecraft.client.renderer.entity.RenderLayerParent;
          import net.minecraft.client.renderer.entity.layers.EquipmentLayerRenderer;
          import net.minecraft.client.renderer.entity.layers.RenderLayer;
          import net.minecraft.client.renderer.entity.state.WolfRenderState;
          import net.minecraft.client.resources.model.EquipmentClientInfo;
          import net.minecraft.core.component.DataComponents;
          import net.minecraft.resources.ResourceKey;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.Items;
          import net.minecraft.world.item.equipment.EquipmentAsset;
          import net.minecraft.world.item.equipment.EquipmentAssets;

          /**
           * Слой рендера волка: седло и элитры.
           *
           * Седло - "как броня для волка" (LayerType.WOLF_BODY, модель WOLF_ARMOR) с ассетом wolfplus:wolf_saddle.
           * Элитры - ванильные текстуры крыльев (LayerType.WINGS) на отдельной модели, уложенной на спину.
           * Снаряжение берётся из WolfRenderState (его заполняет WolfRendererMixin).
           *
           * Любая ошибка при отрисовке один раз пишется в лог, после чего слой отключается (игра не падает).
           */
          public class WolfGearLayer extends RenderLayer<WolfRenderState, WolfModel> {
              private static final ResourceKey<EquipmentAsset> SADDLE_ASSET =
                      ResourceKey.create(EquipmentAssets.ROOT_ID, WolfPlus.id("wolf_saddle"));

              private final EquipmentLayerRenderer equipmentRenderer;
              private final AdultWolfModel saddleModel;
              private final WingsModel wingsModel;
              private boolean broken;

              public WolfGearLayer(RenderLayerParent<WolfRenderState, WolfModel> parent, EntityRendererProvider.Context context) {
                  super(parent);
                  this.equipmentRenderer = context.getEquipmentRenderer();
                  EntityModelSet models = context.getModelSet();
                  this.saddleModel = new AdultWolfModel(models.bakeLayer(ModelLayers.WOLF_ARMOR));
                  this.wingsModel = new WingsModel(models.bakeLayer(ModelLayers.ELYTRA));
              }

              @Override
              public void submit(PoseStack poseStack, SubmitNodeCollector collector, int lightCoords, WolfRenderState state,
                      float yRot, float xRot) {
                  if (this.broken || state.isBaby) {
                      return;
                  }
                  try {
                      WolfGearAccess gear = (WolfGearAccess) state;

                      ItemStack saddle = gear.wolfplus$getSaddle();
                      if (!saddle.isEmpty()) {
                          this.saddleModel.setupAnim(state);
                          this.equipmentRenderer.renderLayers(EquipmentClientInfo.LayerType.WOLF_BODY, SADDLE_ASSET,
                                  this.saddleModel, state, saddle, poseStack, collector, lightCoords, state.outlineColor);
                      }

                      ItemStack elytra = gear.wolfplus$getElytra();
                      if (elytra.is(Items.ELYTRA)) {
                          var equippable = elytra.get(DataComponents.EQUIPPABLE);
                          if (equippable != null && equippable.assetId().isPresent()) {
                              this.wingsModel.setSpread(gear.wolfplus$isFlying());
                              poseStack.pushPose();
                              // Пространство модели: y вниз, -z вперёд. Спина волка - плоскость y = 14/16.
                              // Крыло в своих осях лежит вдоль +y (вниз), толщина вдоль +z.
                              // Поворот +90 по X: крыло ложится вдоль спины к хвосту, наружу смотрит вверх.
                              poseStack.translate(0.0F, 13.6F / 16.0F, -2.0F / 16.0F);
                              poseStack.mulPose(Axis.XP.rotationDegrees(90.0F));
                              poseStack.scale(0.6F, 0.6F, 0.6F);
                              this.equipmentRenderer.renderLayers(EquipmentClientInfo.LayerType.WINGS,
                                      equippable.assetId().get(), this.wingsModel, state, elytra, poseStack, collector,
                                      lightCoords, state.outlineColor);
                              poseStack.popPose();
                          }
                      }
                  } catch (Throwable ex) {
                      this.broken = true;
                      System.err.println("[wolfplus] gear layer disabled after error: " + ex);
                      ex.printStackTrace();
                  }
              }
          }
