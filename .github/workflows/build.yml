          import os, struct, zlib

          # Текстура седла для волка (раскладка 64x32 как у брони волка): сиденье на спине + подпруга вокруг туловища.
          W, H = 64, 32
          px = [[(0, 0, 0, 0)] * W for _ in range(H)]

          def rect(x0, y0, x1, y1, c):
              for y in range(y0, y1):
                  for x in range(x0, x1):
                      px[y][x] = c

          SEAT = (139, 90, 43, 255)
          EDGE = (92, 58, 26, 255)
          BELT = (60, 36, 16, 255)
          BUCKLE = (205, 205, 205, 255)

          rect(36, 20, 42, 29, SEAT)                 # спина
          for x in range(36, 42):
              px[20][x] = EDGE
              px[28][x] = EDGE
          for y in range(20, 29):
              px[y][36] = EDGE
              px[y][41] = EDGE
          for x0 in (18, 24, 30, 36):                # подпруга по всем четырём граням туловища
              rect(x0, 24, x0 + 6, 26, BELT)
          rect(26, 24, 28, 26, BUCKLE)               # пряжка на брюхе

          raw = b"".join(b"\x00" + bytes(v for p in row for v in p) for row in px)

          def chunk(tag, data):
              body = tag + data
              return struct.pack(">I", len(data)) + body + struct.pack(">I", zlib.crc32(body) & 0xFFFFFFFF)

          png = (b"\x89PNG\r\n\x1a\n"
                 + chunk(b"IHDR", struct.pack(">IIBBBBB", W, H, 8, 6, 0, 0, 0))
                 + chunk(b"IDAT", zlib.compress(raw, 9))
                 + chunk(b"IEND", b""))

          out = "src/main/resources/assets/wolfplus/textures/entity/equipment/wolf_body"
          os.makedirs(out, exist_ok=True)
          with open(out + "/wolf_saddle.png", "wb") as f:
              f.write(png)
          WOLFPLUS_EOF

      - name: Resolve Minecraft class names
        run: |
          # Миксины кошки и кролика зависят от путей классов Minecraft 26.2 - находим их автоматически.
          # Если какой-то путь найти не удалось, соответствующий миксин отключается (езда на этом питомце
          # будет без управления), а всё остальное собирается как обычно.
          python3 tools/resolve.py || true
          for f in $(grep -rl '@@' src || true); do
            echo "::warning::riding mixin disabled (class path not resolved): $f"
            b=$(basename "$f" .java)
            rm -f "$f"
            sed -i "/\"$b\"/d" src/main/resources/wolfplus.mixins.json
          done

      - name: Build
        run: |
          # Слой рендера (седло/элитры на модели) завязан на внутренние классы Minecraft 26.2.
          # Если он не соберётся - собираем мод без него, чтобы остальное работало.
          if ! gradle build --stacktrace; then
            echo "::warning::Render layer failed to compile - rebuilding WITHOUT saddle/elytra visuals"
            rm -rf src/client/java/com/wolfplus/client/render src/client/java/com/wolfplus/client/mixin src/client/resources
            sed -i '/wolfplus.client.mixins.json/d' src/main/resources/fabric.mod.json
            gradle build --stacktrace
          fi

      # Выгрузка сигнатур нужных классов Minecraft/Fabric (для отладки рендера): Artifacts -> api-dump
      - name: Dump API signatures
        if: always()
        run: |
          mkdir -p dump
          find ~/.gradle -name '*.jar' -size +1M 2>/dev/null > dump/jars.txt || true
          MC=""
          FAB=""
          while read -r j; do
            L=$(unzip -l "$j" 2>/dev/null || true)
            if [ -z "$MC" ] && echo "$L" | grep -q 'net/minecraft/client/renderer/entity/layers/WolfArmorLayer.class'; then MC="$j"; fi
            if [ -z "$FAB" ] && echo "$L" | grep -q 'LivingEntityRenderLayerRegistrationCallback.class'; then FAB="$j"; fi
          done < dump/jars.txt
          if [ -z "$FAB" ]; then FAB=$(find ~/.gradle -name 'fabric-rendering-v1*.jar' ! -name '*sources*' 2>/dev/null | head -1); fi
          echo "minecraft jar: $MC" > dump/api.txt
          echo "fabric rendering jar: $FAB" >> dump/api.txt
          if [ -n "$MC" ]; then
            CLASSES=$(unzip -l "$MC" | awk '{print $4}' | grep -E '(WolfModel|WolfRenderState|WolfRenderer|ElytraModel|WingsLayer|EquipmentLayerRenderer|SimpleEquipmentLayer|layers/RenderLayer|EntityModelSet|geom/ModelLayers|EquipmentClientInfo|SubmitNodeCollector|LivingEntityRenderState|state/EntityRenderState|client/model/EntityModel|client/model/Model|EntityRendererProvider|LivingEntityRenderer|AgeableMobRenderer|RenderLayerParent|Equippable|EquipmentAssets)\.class$' | sed 's/\.class$//; s#/#.#g')
            echo "$CLASSES" >> dump/api.txt
            javap -p -cp "$MC" $CLASSES >> dump/api.txt 2>&1 || true
          fi
          if [ -n "$FAB" ]; then
            javap -p -cp "$FAB" 'net.fabricmc.fabric.api.client.rendering.v1.LivingEntityRenderLayerRegistrationCallback' 'net.fabricmc.fabric.api.client.rendering.v1.LivingEntityRenderLayerRegistrationCallback$RegistrationHelper' >> dump/api.txt 2>&1 || true
          fi

      - name: Upload API dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-dump
          path: dump/api.txt
          if-no-files-found: ignore

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: wolfplus
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      # При пуше тега вида v1.0.0 jar прикрепляется к GitHub Release
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
