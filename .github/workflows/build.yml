name: build

# Самодостаточный workflow: весь код мода встроен в этот файл.
# Положите его в .github/workflows/build.yml пустого репозитория и запустите (Actions -> build -> Run workflow).

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.0

      - name: Generate mod project
        run: |
          cat > 'gradle.properties' <<'WOLFPLUS_EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          # IntelliJ IDEA пока не полностью совместима с configuration cache
          org.gradle.configuration-cache=false

          # Fabric (https://fabricmc.net/develop)
          minecraft_version=26.2
          loader_version=0.19.5
          loom_version=1.18.4
          fabric_api_version=0.161.0+26.2

          # Мод
          mod_version=1.1.0
          maven_group=com.wolfplus
          archives_base_name=wolfplus
          WOLFPLUS_EOF
          cat > 'settings.gradle' <<'WOLFPLUS_EOF'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          WOLFPLUS_EOF
          cat > 'build.gradle' <<'WOLFPLUS_EOF'
          plugins {
              id 'net.fabricmc.fabric-loom' version "${loom_version}"
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
          }

          loom {
              splitEnvironmentSourceSets()

              mods {
                  "wolfplus" {
                      sourceSet sourceSets.main
                      sourceSet sourceSets.client
                  }
              }
          }

          dependencies {
              // Minecraft 26.x не обфусцирован: маппинги и remap не нужны
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              implementation "net.fabricmc:fabric-loader:${project.loader_version}"
              implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          }

          processResources {
              inputs.property "version", project.version

              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 25
              it.options.encoding = "UTF-8"
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_25
              targetCompatibility = JavaVersion.VERSION_25
          }
          WOLFPLUS_EOF
          mkdir -p 'src/client/java/com/wolfplus/client'
          cat > 'src/client/java/com/wolfplus/client/UntameConfirmScreen.java' <<'WOLFPLUS_EOF'
          package com.wolfplus.client;

          import com.wolfplus.net.UntameWolfPayload;
          import net.fabricmc.fabric.api.client.networking.v1.ClientPlayNetworking;
          import net.minecraft.client.gui.GuiGraphicsExtractor;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.network.chat.Component;

          /**
           * Двойное подтверждение расприручения.
           * Шаг 1 - обычный вопрос. Шаг 2 - предупреждение; кнопки там поменяны местами,
           * чтобы нельзя было случайно "дважды кликнуть в одно место".
           */
          public class UntameConfirmScreen extends Screen {
              private final Screen parent;
              private final int entityId;
              private final int step;

              public UntameConfirmScreen(Screen parent, int entityId, int step) {
                  super(Component.translatable("wolfplus.untame.title" + step));
                  this.parent = parent;
                  this.entityId = entityId;
                  this.step = step;
              }

              @Override
              protected void init() {
                  int cx = this.width / 2;
                  int y = this.height / 2 + 10;

                  Button yes = Button.builder(Component.translatable("wolfplus.untame.yes" + this.step), b -> onYes())
                          .bounds(step == 1 ? cx - 105 : cx + 5, y, 100, 20).build();
                  Button no = Button.builder(Component.translatable("wolfplus.untame.no"), b -> this.onClose())
                          .bounds(step == 1 ? cx + 5 : cx - 105, y, 100, 20).build();

                  this.addRenderableWidget(yes);
                  this.addRenderableWidget(no);
              }

              private void onYes() {
                  if (this.step == 1) {
                      this.minecraft.gui.setScreen(new UntameConfirmScreen(this.parent, this.entityId, 2));
                  } else {
                      ClientPlayNetworking.send(new UntameWolfPayload(this.entityId));
                      this.minecraft.gui.setScreen(null);
                  }
              }

              /** Отмена / Esc: возвращаемся в меню волка. */
              @Override
              public void onClose() {
                  this.minecraft.gui.setScreen(this.parent);
              }

              @Override
              public void extractRenderState(GuiGraphicsExtractor graphics, int mouseX, int mouseY, float delta) {
                  super.extractRenderState(graphics, mouseX, mouseY, delta);

                  int cx = this.width / 2;
                  int y = this.height / 2 - 30;

                  String title = this.title.getString();
                  graphics.text(this.font, title, cx - this.font.width(title) / 2, y, 0xFFFFFFFF, true);

                  String line = Component.translatable("wolfplus.untame.text" + this.step).getString();
                  graphics.text(this.font, line, cx - this.font.width(line) / 2, y + 16, 0xFFFF8080, true);
              }
          }
          WOLFPLUS_EOF
          mkdir -p 'src/client/java/com/wolfplus/client'
          cat > 'src/client/java/com/wolfplus/client/WolfMenuScreen.java' <<'WOLFPLUS_EOF'
          package com.wolfplus.client;

          import com.wolfplus.WolfOptions;
          import com.wolfplus.mixin.WolfAccess;
          import com.wolfplus.net.OpenWolfMenuPayload;
          import com.wolfplus.net.WolfSettingsPayload;
          import net.fabricmc.fabric.api.client.networking.v1.ClientPlayNetworking;
          import net.minecraft.client.gui.GuiGraphicsExtractor;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.components.EditBox;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.client.gui.screens.inventory.InventoryScreen;
          import net.minecraft.core.registries.BuiltInRegistries;
          import net.minecraft.network.chat.Component;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.EntitySpawnReason;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.animal.wolf.Wolf;
          import net.minecraft.world.item.DyeColor;

          /** Меню настройки волка: имя, порода, цвет ошейника, 3D-превью (+ расприручение). */
          public class WolfMenuScreen extends Screen {
              private static final DyeColor[] COLORS = DyeColor.values();

              /** Фиктивный ID для превью-волка: в мир он не попадает, поэтому коллизий нет. */
              private static final int PREVIEW_ENTITY_ID = 0x7FFFFF01;

              private static final int PANEL_W = 96;
              private static final int PANEL_H = 170;
              private static final int GAP = 8;

              private final int entityId;
              private final boolean firstTime;

              private String name;
              private int variant;
              private int color;

              private Button variantButton;
              private Button colorButton;

              /** Клиентская копия волка только для показа модельки. */
              private Wolf preview;
              private float previewBase = 0.85f;

              private int panelX;
              private int panelY;

              public WolfMenuScreen(OpenWolfMenuPayload payload) {
                  super(Component.translatable(payload.firstTime() ? "wolfplus.menu.title_new" : "wolfplus.menu.title"));
                  this.entityId = payload.entityId();
                  this.firstTime = payload.firstTime();
                  this.name = payload.name();
                  this.variant = Math.floorMod(payload.variantIndex(), WolfOptions.VARIANTS.size());
                  this.color = Math.floorMod(payload.colorId(), COLORS.length);
              }

              private int top() {
                  return this.height / 2 - 90;
              }

              @Override
              protected void init() {
                  int ctrlW = Math.max(140, Math.min(200, this.width - PANEL_W - GAP - 16));
                  int total = PANEL_W + GAP + ctrlW;
                  int left = (this.width - total) / 2;
                  int ctrlX = left + PANEL_W + GAP;
                  int top = top();

                  this.panelX = left;
                  this.panelY = top + 14;

                  if (this.preview == null) {
                      makePreview();
                  }

                  // I. Имя
                  EditBox nameBox = new EditBox(this.font, ctrlX, top + 26, ctrlW, 20,
                          Component.translatable("wolfplus.menu.name"));
                  nameBox.setMaxLength(WolfOptions.MAX_NAME_LENGTH);
                  nameBox.setValue(this.name);
                  nameBox.setHint(Component.translatable("wolfplus.menu.name_hint"));
                  nameBox.setResponder(value -> this.name = value);
                  this.addRenderableWidget(nameBox);
                  this.setInitialFocus(nameBox);

                  // II. Порода
                  int variantY = top + 66;
                  this.addRenderableWidget(Button.builder(Component.literal("<"), b -> cycleVariant(-1))
                          .bounds(ctrlX, variantY, 20, 20).build());
                  this.variantButton = this.addRenderableWidget(Button.builder(variantLabel(), b -> cycleVariant(1))
                          .bounds(ctrlX + 22, variantY, ctrlW - 44, 20).build());
                  this.addRenderableWidget(Button.builder(Component.literal(">"), b -> cycleVariant(1))
                          .bounds(ctrlX + ctrlW - 20, variantY, 20, 20).build());

                  // III. Цвет ошейника
                  int colorY = top + 106;
                  this.addRenderableWidget(Button.builder(Component.literal("<"), b -> cycleColor(-1))
                          .bounds(ctrlX, colorY, 20, 20).build());
                  this.colorButton = this.addRenderableWidget(Button.builder(colorLabel(), b -> cycleColor(1))
                          .bounds(ctrlX + 22, colorY, ctrlW - 44, 20).build());
                  this.addRenderableWidget(Button.builder(Component.literal(">"), b -> cycleColor(1))
                          .bounds(ctrlX + ctrlW - 20, colorY, 20, 20).build());

                  // Кнопки
                  this.addRenderableWidget(Button.builder(
                                  Component.translatable(this.firstTime ? "wolfplus.menu.done" : "wolfplus.menu.save"),
                                  b -> save())
                          .bounds(ctrlX, top + 140, ctrlW, 20).build());

                  if (this.firstTime) {
                      this.addRenderableWidget(Button.builder(Component.translatable("wolfplus.menu.skip"), b -> this.onClose())
                              .bounds(ctrlX, top + 164, ctrlW, 20).build());
                  } else {
                      this.addRenderableWidget(Button.builder(Component.translatable("wolfplus.menu.untame"),
                                      b -> this.minecraft.gui.setScreen(new UntameConfirmScreen(this, this.entityId, 1)))
                              .bounds(ctrlX, top + 164, ctrlW, 20).build());
                  }
              }

              // ------------------------------------------------------------ превью

              /** Создаёт клиентскую копию волка (в мир она не добавляется) и применяет текущие настройки. */
              private void makePreview() {
                  this.preview = null;
                  if (this.minecraft == null || this.minecraft.level == null) {
                      return;
                  }
                  try {
                      // В 26.2 константы EntityType.WOLF нет - ищем тип волка в реестре.
                      EntityType<?> wolfType = null;
                      for (EntityType<?> type : BuiltInRegistries.ENTITY_TYPE) {
                          if (BuiltInRegistries.ENTITY_TYPE.getKey(type).toString().equals("minecraft:wolf")) {
                              wolfType = type;
                              break;
                          }
                      }
                      if (wolfType == null) {
                          return;
                      }
                      Entity created = wolfType.create(this.minecraft.level, EntitySpawnReason.LOAD);
                      if (!(created instanceof Wolf wolf)) {
                          return;
                      }
                      // Моб вне мира не имеет ID, а рендерер его требует - выдаём фиктивный.
                      wolf.setId(PREVIEW_ENTITY_ID);
                      wolf.setTame(true, false);        // ошейник рисуется только у прирученного
                      wolf.setInSittingPose(true);      // сидит, как только что приручённый
                      this.previewBase = Math.max(wolf.getBbHeight(), wolf.getBbWidth() * 0.9f);
                      this.preview = wolf;
                      updatePreview();
                  } catch (Throwable ex) {
                      this.preview = null;
                  }
              }

              private void updatePreview() {
                  if (this.preview == null) {
                      return;
                  }
                  WolfOptions.applyVariant(this.preview, this.variant);
                  ((WolfAccess) this.preview).wolfplus$setCollarColor(COLORS[this.color]);
              }

              // ------------------------------------------------------------ подписи и кнопки

              private Component variantLabel() {
                  return Component.translatable("wolfplus.menu.breed",
                          Component.translatable("wolfplus.variant." + WolfOptions.VARIANTS.get(this.variant)));
              }

              private Component colorLabel() {
                  DyeColor dye = COLORS[this.color];
                  Component colorName = Component.translatable("color.minecraft." + dye.getName())
                          .withColor(dye.getTextColor());
                  return Component.translatable("wolfplus.menu.collar", colorName);
              }

              private void cycleVariant(int step) {
                  this.variant = Math.floorMod(this.variant + step, WolfOptions.VARIANTS.size());
                  this.variantButton.setMessage(variantLabel());
                  updatePreview();
              }

              private void cycleColor(int step) {
                  this.color = Math.floorMod(this.color + step, COLORS.length);
                  this.colorButton.setMessage(colorLabel());
                  updatePreview();
              }

              private void save() {
                  ClientPlayNetworking.send(new WolfSettingsPayload(this.entityId, this.name, this.variant, COLORS[this.color].getId()));
                  this.onClose();
              }

              // ------------------------------------------------------------ отрисовка

              @Override
              public void extractRenderState(GuiGraphicsExtractor graphics, int mouseX, int mouseY, float delta) {
                  super.extractRenderState(graphics, mouseX, mouseY, delta);

                  int ctrlW = Math.max(140, Math.min(200, this.width - PANEL_W - GAP - 16));
                  int total = PANEL_W + GAP + ctrlW;
                  int left = (this.width - total) / 2;
                  int ctrlX = left + PANEL_W + GAP;
                  int top = top();

                  drawCentered(graphics, this.title.getString(), left + total / 2, top, 0xFFFFFFFF);
                  drawLabel(graphics, Component.translatable("wolfplus.menu.name").getString(), ctrlX, top + 14);
                  drawLabel(graphics, Component.translatable("wolfplus.menu.breed_label").getString(), ctrlX, top + 54);
                  drawLabel(graphics, Component.translatable("wolfplus.menu.collar_label").getString(), ctrlX, top + 94);

                  // Тёмная панель под моделькой.
                  graphics.fill(this.panelX, this.panelY, this.panelX + PANEL_W, this.panelY + PANEL_H, 0xCC101010);
                  graphics.nextStratum();

                  // Моделька следит за курсором, как в инвентаре.
                  if (this.preview != null) {
                      int modelBottom = this.panelY + PANEL_H - 16;
                      int modelH = modelBottom - this.panelY;
                      int scale = (int) Math.max(2.0, Math.min(200.0, modelH * 0.55 / this.previewBase));
                      InventoryScreen.extractEntityInInventoryFollowsMouse(graphics,
                              this.panelX, this.panelY, this.panelX + PANEL_W, modelBottom,
                              scale, 0.0625f, (float) mouseX, (float) mouseY, this.preview);
                  }

                  // Подпись под моделькой: имя, а если его нет - порода.
                  String caption = this.name.isBlank()
                          ? Component.translatable("wolfplus.variant." + WolfOptions.VARIANTS.get(this.variant)).getString()
                          : this.name.strip();
                  while (caption.length() > 1 && this.font.width(caption) > PANEL_W - 6) {
                      caption = caption.substring(0, caption.length() - 1);
                  }
                  drawCentered(graphics, caption, this.panelX + PANEL_W / 2, this.panelY + PANEL_H - 12, 0xFFFFFFFF);
              }

              private void drawCentered(GuiGraphicsExtractor graphics, String text, int centerX, int y, int color) {
                  graphics.text(this.font, text, centerX - this.font.width(text) / 2, y, color, true);
              }

              private void drawLabel(GuiGraphicsExtractor graphics, String text, int x, int y) {
                  graphics.text(this.font, text, x, y, 0xFFA0A0A0, true);
              }
          }
          WOLFPLUS_EOF
          mkdir -p 'src/client/java/com/wolfplus/client'
          cat > 'src/client/java/com/wolfplus/client/WolfPlusClient.java' <<'WOLFPLUS_EOF'
          package com.wolfplus.client;

          import com.wolfplus.net.MountWolfPayload;
          import com.wolfplus.net.OpenWolfMenuPayload;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.networking.v1.ClientPlayNetworking;
          import net.fabricmc.fabric.api.event.player.AttackEntityCallback;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.entity.animal.wolf.Wolf;

          public class WolfPlusClient implements ClientModInitializer {
              @Override
              public void onInitializeClient() {
                  ClientPlayNetworking.registerGlobalReceiver(OpenWolfMenuPayload.TYPE, (payload, context) ->
                          context.client().gui.setScreen(new WolfMenuScreen(payload)));

                  // Shift + удар по своему волку -> запрос на посадку верхом.
                  // Событие на клиенте отменяет сам удар (пакет атаки на сервер не уходит),
                  // поэтому посадку просим отдельным пакетом.
                  AttackEntityCallback.EVENT.register((player, level, hand, entity, hitResult) -> {
                      if (!level.isClientSide() || player.isSpectator()) {
                          return InteractionResult.PASS;
                      }
                      if (entity instanceof Wolf wolf
                              && wolf.isTame()
                              && player.isShiftKeyDown()
                              && !player.isPassenger()
                              && wolf.isOwnedBy(player)) {
                          ClientPlayNetworking.send(new MountWolfPayload(wolf.getId()));
                          return InteractionResult.SUCCESS;
                      }
                      return InteractionResult.PASS;
                  });
              }
          }
          WOLFPLUS_EOF
          mkdir -p 'src/main/java/com/wolfplus'
          cat > 'src/main/java/com/wolfplus/WolfOptions.java' <<'WOLFPLUS_EOF'
          package com.wolfplus;

          import com.wolfplus.mixin.WolfAccess;
          import java.util.List;
          import net.minecraft.core.Holder;
          import net.minecraft.core.registries.Registries;
          import net.minecraft.resources.Identifier;
          import net.minecraft.resources.ResourceKey;
          import net.minecraft.world.entity.animal.wolf.Wolf;
          import net.minecraft.world.entity.animal.wolf.WolfVariant;
          import net.minecraft.world.level.Level;

          /** Список пород (вариантов волка) и работа с ними. */
          public final class WolfOptions {
              /** Ванильные породы; порядок = порядок в меню. Названия: wolfplus.variant.<имя>. */
              public static final List<String> VARIANTS = List.of(
                      "pale", "spotted", "snowy", "black", "ashen", "rusty", "woods", "chestnut", "striped");

              public static final int MAX_NAME_LENGTH = 32;

              private WolfOptions() {
              }

              private static ResourceKey<WolfVariant> key(int index) {
                  return ResourceKey.create(Registries.WOLF_VARIANT, Identifier.withDefaultNamespace(VARIANTS.get(index)));
              }

              /** Индекс текущей породы волка (0, если порода не из списка). */
              public static int variantIndexOf(Wolf wolf) {
                  Holder<WolfVariant> current = ((WolfAccess) wolf).wolfplus$getVariant();
                  for (int i = 0; i < VARIANTS.size(); i++) {
                      if (current.is(key(i))) {
                          return i;
                      }
                  }
                  return 0;
              }

              /** Ставит породу по индексу; неверный индекс игнорируется. */
              public static void applyVariant(Wolf wolf, int index) {
                  if (index < 0 || index >= VARIANTS.size()) {
                      return;
                  }
                  Level level = wolf.level();
                  level.registryAccess()
                          .lookupOrThrow(Registries.WOLF_VARIANT)
                          .get(key(index))
                          .ifPresent(holder -> ((WolfAccess) wolf).wolfplus$setVariant(holder));
              }
          }
          WOLFPLUS_EOF
          mkdir -p 'src/main/java/com/wolfplus'
          cat > 'src/main/java/com/wolfplus/WolfPlus.java' <<'WOLFPLUS_EOF'
          package com.wolfplus;

          import com.wolfplus.net.MountWolfPayload;
          import com.wolfplus.net.OpenWolfMenuPayload;
          import com.wolfplus.net.UntameWolfPayload;
          import com.wolfplus.net.WolfSettingsPayload;
          import net.fabricmc.api.ModInitializer;
          import net.fabricmc.fabric.api.networking.v1.PayloadTypeRegistry;
          import net.minecraft.resources.Identifier;

          public class WolfPlus implements ModInitializer {
              public static final String MOD_ID = "wolfplus";

              public static Identifier id(String path) {
                  return Identifier.fromNamespaceAndPath(MOD_ID, path);
              }

              @Override
              public void onInitialize() {
                  PayloadTypeRegistry.clientboundPlay().register(OpenWolfMenuPayload.TYPE, OpenWolfMenuPayload.CODEC);
                  PayloadTypeRegistry.serverboundPlay().register(WolfSettingsPayload.TYPE, WolfSettingsPayload.CODEC);
                  PayloadTypeRegistry.serverboundPlay().register(UntameWolfPayload.TYPE, UntameWolfPayload.CODEC);
                  PayloadTypeRegistry.serverboundPlay().register(MountWolfPayload.TYPE, MountWolfPayload.CODEC);

                  WolfTaming.register();
              }
          }
          WOLFPLUS_EOF
          mkdir -p 'src/main/java/com/wolfplus'
          cat > 'src/main/java/com/wolfplus/WolfTaming.java' <<'WOLFPLUS_EOF'
          package com.wolfplus;

          import com.wolfplus.mixin.MobAccess;
          import com.wolfplus.mixin.WolfAccess;
          import com.wolfplus.net.MountWolfPayload;
          import com.wolfplus.net.OpenWolfMenuPayload;
          import com.wolfplus.net.UntameWolfPayload;
          import com.wolfplus.net.WolfSettingsPayload;
          import java.util.HashMap;
          import java.util.Iterator;
          import java.util.Map;
          import java.util.Set;
          import java.util.UUID;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerLifecycleEvents;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents;
          import net.fabricmc.fabric.api.event.player.UseEntityCallback;
          import net.fabricmc.fabric.api.networking.v1.ServerPlayNetworking;
          import net.minecraft.network.chat.Component;
          import net.minecraft.server.MinecraftServer;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.EquipmentSlot;
          import net.minecraft.world.entity.animal.wolf.Wolf;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.item.DyeColor;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.Items;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.phys.EntityHitResult;

          /**
           * Вся серверная логика мода.
           *
           * Приручение работает через "очки приручения" (нужно набрать {@link #NEEDED}):
           *  - кость даёт 5 или 10 очков  -> приручение за 1-2 кости, гарантированно не больше 2;
           *  - кусок мяса даёт 2-4 очка   -> приручение за 3-5 кусков, гарантированно не больше 5;
           *  - смешанное кормление тоже суммируется.
           *
           * Верховая езда:
           *  - Shift + удар по своему волку -> посадка (срабатывает, когда игрок отпустит Shift,
           *    иначе игру сразу бы ссадило: Shift = слезть);
           *  - седло надевается ПКМ, снимается ножницами (как у остальных сёдел);
           *  - без седла волк идёт сам, с седлом - им управляет игрок (логика в WolfRideMixin).
           */
          public final class WolfTaming {
              private static final int NEEDED = 10;
              private static final double MAX_DISTANCE_SQ = 10.0 * 10.0;

              /** Сколько тиков ждём, пока игрок отпустит Shift, прежде чем отменить посадку. */
              private static final int MOUNT_WAIT_TICKS = 60;

              /** Прогресс приручения диких волков. Сбрасывается при остановке сервера. */
              private static final Map<UUID, Integer> PROGRESS = new HashMap<>();

              /** Ожидающие посадки: игрок -> волк. */
              private static final Map<UUID, PendingMount> PENDING_MOUNTS = new HashMap<>();

              /** Любое мясо (плюс всё, что ванилла считает едой для волка). */
              private static final Set<Item> MEAT = Set.of(
                      Items.BEEF, Items.COOKED_BEEF,
                      Items.PORKCHOP, Items.COOKED_PORKCHOP,
                      Items.CHICKEN, Items.COOKED_CHICKEN,
                      Items.MUTTON, Items.COOKED_MUTTON,
                      Items.RABBIT, Items.COOKED_RABBIT,
                      Items.ROTTEN_FLESH);

              private static final class PendingMount {
                  final int wolfId;
                  int ticksLeft = MOUNT_WAIT_TICKS;

                  PendingMount(int wolfId) {
                      this.wolfId = wolfId;
                  }
              }

              private WolfTaming() {
              }

              public static void register() {
                  UseEntityCallback.EVENT.register(WolfTaming::onUse);
                  ServerTickEvents.END_SERVER_TICK.register(WolfTaming::tickPendingMounts);
                  ServerLifecycleEvents.SERVER_STOPPED.register(server -> {
                      PROGRESS.clear();
                      PENDING_MOUNTS.clear();
                  });

                  ServerPlayNetworking.registerGlobalReceiver(WolfSettingsPayload.TYPE, (payload, context) -> {
                      Wolf wolf = findOwnedWolf(context.player(), payload.entityId());
                      if (wolf != null) {
                          applySettings(wolf, payload);
                      }
                  });

                  ServerPlayNetworking.registerGlobalReceiver(UntameWolfPayload.TYPE, (payload, context) -> {
                      Wolf wolf = findOwnedWolf(context.player(), payload.entityId());
                      if (wolf != null) {
                          untame(wolf, context.player());
                      }
                  });

                  ServerPlayNetworking.registerGlobalReceiver(MountWolfPayload.TYPE, (payload, context) -> {
                      ServerPlayer player = context.player();
                      Wolf wolf = findOwnedWolf(player, payload.entityId());
                      if (wolf != null && !player.isPassenger() && !player.isSpectator()) {
                          PENDING_MOUNTS.put(player.getUUID(), new PendingMount(wolf.getId()));
                      }
                  });
              }

              // ---------------------------------------------------------------- взаимодействие

              private static InteractionResult onUse(Player player, Level level, InteractionHand hand, Entity entity,
                      EntityHitResult hitResult) {
                  if (!(entity instanceof Wolf wolf) || player.isSpectator()) {
                      return InteractionResult.PASS;
                  }

                  boolean client = level.isClientSide();
                  InteractionResult handled = client ? InteractionResult.SUCCESS : InteractionResult.SUCCESS_SERVER;
                  ItemStack stack = player.getItemInHand(hand);

                  if (wolf.isTame()) {
                      if (wolf.isOwnedBy(player)) {
                          // Седло: ПКМ седлом по своему волку (взрослому)
                          if (stack.is(Items.SADDLE) && !hasSaddle(wolf) && !wolf.isBaby()) {
                              if (!client) {
                                  ((MobAccess) wolf).wolfplus$setItemSlotAndDropWhenKilled(
                                          EquipmentSlot.SADDLE, stack.copyWithCount(1));
                                  stack.consume(1, player);
                              }
                              return handled;
                          }
                          // Снять седло: ножницы (как у других ездовых)
                          if (stack.is(Items.SHEARS) && hasSaddle(wolf)) {
                              if (!client) {
                                  ItemStack saddle = wolf.getItemBySlot(EquipmentSlot.SADDLE).copy();
                                  wolf.setItemSlot(EquipmentSlot.SADDLE, ItemStack.EMPTY);
                                  giveOrDrop(player, saddle);
                                  stack.hurtAndBreak(1, player,
                                          hand == InteractionHand.MAIN_HAND ? EquipmentSlot.MAINHAND : EquipmentSlot.OFFHAND);
                              }
                              return handled;
                          }
                      }

                      // Shift + ПКМ пустой рукой по своему волку -> меню настройки / расприручения
                      if (hand == InteractionHand.MAIN_HAND && stack.isEmpty() && player.isShiftKeyDown()
                              && wolf.isOwnedBy(player)) {
                          if (!client && player instanceof ServerPlayer serverPlayer) {
                              openMenu(serverPlayer, wolf, false);
                          }
                          return handled;
                      }
                      return InteractionResult.PASS; // всё остальное - как в ванилле
                  }

                  // Дикий волк: кость или мясо
                  boolean bone = stack.is(Items.BONE);
                  if (!bone && !isMeat(wolf, stack)) {
                      return InteractionResult.PASS;
                  }
                  if (wolf.getTarget() == player) {
                      return InteractionResult.PASS; // волк злится на этого игрока - так его не приручить
                  }

                  if (!client && player instanceof ServerPlayer serverPlayer) {
                      feed(serverPlayer, wolf, stack, bone);
                  }
                  return handled;
              }

              private static boolean isMeat(Wolf wolf, ItemStack stack) {
                  return !stack.isEmpty() && (MEAT.contains(stack.getItem()) || wolf.isFood(stack));
              }

              private static void feed(ServerPlayer player, Wolf wolf, ItemStack stack, boolean bone) {
                  var random = wolf.getRandom();
                  stack.consume(1, player);

                  int gain = bone ? (random.nextBoolean() ? 5 : 10) : 2 + random.nextInt(3);
                  int total = PROGRESS.merge(wolf.getUUID(), gain, Integer::sum);
                  Level level = wolf.level();

                  if (total >= NEEDED) {
                      PROGRESS.remove(wolf.getUUID());
                      wolf.tame(player);
                      wolf.getNavigation().stop();
                      wolf.setTarget(null);
                      wolf.setOrderedToSit(true);
                      level.broadcastEntityEvent(wolf, (byte) 7); // сердечки
                      openMenu(player, wolf, true);
                  } else {
                      level.broadcastEntityEvent(wolf, (byte) 6); // дымок: пока не вышло
                  }
              }

              // ---------------------------------------------------------------- верховая езда

              private static boolean hasSaddle(Wolf wolf) {
                  return !wolf.getItemBySlot(EquipmentSlot.SADDLE).isEmpty();
              }

              private static void giveOrDrop(Player player, ItemStack stack) {
                  if (!player.getInventory().add(stack)) {
                      player.drop(stack, false);
                  }
              }

              /**
               * Садим игрока на волка, как только он отпустит Shift
               * (пока Shift зажат, игрок на волке не удержится - ванилла сразу ссаживает).
               */
              private static void tickPendingMounts(MinecraftServer server) {
                  if (PENDING_MOUNTS.isEmpty()) {
                      return;
                  }
                  Iterator<Map.Entry<UUID, PendingMount>> it = PENDING_MOUNTS.entrySet().iterator();
                  while (it.hasNext()) {
                      Map.Entry<UUID, PendingMount> entry = it.next();
                      PendingMount pending = entry.getValue();
                      ServerPlayer player = server.getPlayerList().getPlayer(entry.getKey());

                      if (player == null || player.isPassenger() || --pending.ticksLeft < 0) {
                          it.remove();
                          continue;
                      }
                      if (player.isShiftKeyDown()) {
                          continue; // ждём, пока отпустит
                      }

                      Wolf wolf = findOwnedWolf(player, pending.wolfId);
                      if (wolf != null && !wolf.isVehicle()) {
                          wolf.setOrderedToSit(false);
                          wolf.setInSittingPose(false);
                          wolf.getNavigation().stop();
                          player.startRiding(wolf);
                      }
                      it.remove();
                  }
              }

              // ---------------------------------------------------------------- меню

              private static void openMenu(ServerPlayer player, Wolf wolf, boolean firstTime) {
                  String name = wolf.hasCustomName() ? wolf.getCustomName().getString() : "";
                  ServerPlayNetworking.send(player, new OpenWolfMenuPayload(
                          wolf.getId(),
                          firstTime,
                          name,
                          WolfOptions.variantIndexOf(wolf),
                          wolf.getCollarColor().getId()));
              }

              /** Волк, который существует, приручён, принадлежит игроку и находится рядом. Иначе null. */
              private static Wolf findOwnedWolf(ServerPlayer player, int entityId) {
                  Entity entity = player.level().getEntity(entityId);
                  if (entity instanceof Wolf wolf
                          && wolf.isTame()
                          && wolf.isOwnedBy(player)
                          && wolf.distanceToSqr(player) <= MAX_DISTANCE_SQ) {
                      return wolf;
                  }
                  return null;
              }

              private static void applySettings(Wolf wolf, WolfSettingsPayload payload) {
                  String name = payload.name().strip();
                  if (name.length() > WolfOptions.MAX_NAME_LENGTH) {
                      name = name.substring(0, WolfOptions.MAX_NAME_LENGTH);
                  }
                  wolf.setCustomName(name.isEmpty() ? null : Component.literal(name));

                  WolfOptions.applyVariant(wolf, payload.variantIndex());

                  DyeColor color = DyeColor.byId(payload.colorId());
                  ((WolfAccess) wolf).wolfplus$setCollarColor(color);
              }

              // ---------------------------------------------------------------- расприручение

              private static void untame(Wolf wolf, ServerPlayer player) {
                  // Ссаживаем всадника и возвращаем седло владельцу.
                  wolf.ejectPassengers();
                  ItemStack saddle = wolf.getItemBySlot(EquipmentSlot.SADDLE);
                  if (!saddle.isEmpty()) {
                      ItemStack returned = saddle.copy();
                      wolf.setItemSlot(EquipmentSlot.SADDLE, ItemStack.EMPTY);
                      giveOrDrop(player, returned);
                  }

                  wolf.setOrderedToSit(false);
                  wolf.setInSittingPose(false);
                  wolf.setOwnerReference(null);
                  wolf.setTame(false, true);
                  wolf.setCustomName(null);
                  wolf.setTarget(null);
                  wolf.getNavigation().stop();
                  wolf.level().broadcastEntityEvent(wolf, (byte) 6);
              }
          }
