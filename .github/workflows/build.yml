                  // а не переключать сидение (его делает мод приручения кроликов).
                  Identifier early = WolfPlus.id("early");
                  UseEntityCallback.EVENT.addPhaseOrdering(early, Event.DEFAULT_PHASE);
                  UseEntityCallback.EVENT.register(early, WolfTaming::onUse);

                  ServerTickEvents.END_SERVER_TICK.register(server -> {
                      tickPendingMounts(server);
                      tickFlights(server);
